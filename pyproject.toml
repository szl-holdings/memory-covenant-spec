[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-covenant-spec"
version = "0.4.0a1"
description = "The Memory Covenant — governed agent memory: deny-by-default gateway, hash-chained receipts, conformance suite (v0.4-draft)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SZL Holdings" }]
keywords = ["governed-ai", "agent-memory", "provenance", "receipts", "dsse", "memory-covenant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
mem0 = ["mem0ai"]
zep = ["zep-cloud"]

[project.urls]
Source = "https://github.com/szl-holdings/memory-covenant-spec"

# Explicit package list: the flat layout has three top-level folders
# (covenant, adapters, conformance), so setuptools auto-discovery refuses to build.
# Ship the gateway as `covenant` and the adapters as `covenant.adapters`;
# the conformance suite stays a repo-only test harness and is not installed.
[tool.setuptools]
packages = ["covenant", "covenant.adapters"]

[tool.setuptools.package-dir]
"covenant.adapters" = "adapters"
